[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[client]
# 将工具栏模式设置为最小化，这会隐藏 GitHub 图标、编辑图标和大部分菜单
toolbarMode = "minimal"

[browser]
# 隐藏“收集使用统计数据”的提示（可选，让页面更干净）
gatherUsageStats = false
